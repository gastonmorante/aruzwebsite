<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="100%" height="100%">
  <!-- CADE Official Logo Vector - Dark Version for Light Card Backgrounds -->
  
  <!-- Left Emblem: Architectural Buildings & Crane Beam in Carbon -->
  <g id="cade-emblem" transform="translate(10, 12)">
    <!-- Left Crane / Beam Line -->
    <line x1="0" y1="75" x2="45" y2="45" stroke="#231F20" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="55" x2="16" y2="155" stroke="#231F20" stroke-width="6"/>
    
    <!-- Left Mid-Rise Tower -->
    <path d="M 28 85 L 50 85 L 50 155 L 28 155 Z" fill="#231F20"/>
    
    <!-- Center Tall Skyscraper with Windows -->
    <path d="M 58 10 L 105 45 L 105 155 L 58 155 Z" fill="none" stroke="#231F20" stroke-width="7"/>
    <path d="M 58 10 L 105 45 L 105 155 L 58 155 Z" fill="#EEB623" opacity="0.18"/>
    
    <!-- Windows Grid on Tall Skyscraper -->
    <rect x="70" y="55" width="8" height="9" fill="#231F20"/>
    <rect x="85" y="66" width="8" height="9" fill="#231F20"/>
    <rect x="70" y="73" width="8" height="9" fill="#231F20"/>
    <rect x="85" y="84" width="8" height="9" fill="#231F20"/>
    <rect x="70" y="91" width="8" height="9" fill="#231F20"/>
    <rect x="85" y="102" width="8" height="9" fill="#231F20"/>
    
    <!-- Foreground Angled Luxury Building with Facade Lines -->
    <path d="M 88 88 L 138 65 L 138 155 L 88 155 Z" fill="#231F20"/>
    <path d="M 115 90 L 138 78 L 138 155 L 115 155 Z" fill="#3F5D48" stroke="#231F20" stroke-width="2"/>
    <!-- Louver Facade Lines -->
    <line x1="118" y1="108" x2="135" y2="100" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="118" y1="124" x2="135" y2="116" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="118" y1="140" x2="135" y2="132" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Base Foundation Line -->
    <line x1="16" y1="155" x2="140" y2="155" stroke="#231F20" stroke-width="6"/>
  </g>

  <!-- Right Wordmark: CADE DISEÑO Y CONSTRUCCIÓN -->
  <g id="cade-wordmark" transform="translate(175, 12)">
    <text x="0" y="98" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="104" font-weight="900" letter-spacing="3px" fill="#231F20">CADE</text>
    <text x="2" y="142" font-family="'Montserrat', 'Work Sans', sans-serif" font-size="23" font-weight="700" letter-spacing="5px" fill="#59555A">DISEÑO Y CONSTRUCCIÓN</text>
  </g>
</svg>
