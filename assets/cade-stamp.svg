<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <path id="textCircleTop" d="M 30,130 A 100,100 0 0,1 230,130" fill="none"/>
    <path id="textCircleBottom" d="M 230,130 A 100,100 0 0,1 30,130" fill="none"/>
  </defs>
  <!-- Outer double ring -->
  <circle cx="130" cy="130" r="122" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="130" cy="130" r="114" fill="#FFFFFF" stroke="#EEB623" stroke-width="3"/>
  <circle cx="130" cy="130" r="82" fill="#FAF8F5" stroke="#231F20" stroke-width="1.5"/>

  <!-- Circular curved text -->
  <text font-family="'Poppins', sans-serif" font-size="10.5" font-weight="700" fill="#231F20" letter-spacing="2.8px">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      CONSTRUIDO Y AVALADO
    </textPath>
  </text>
  <text font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#59555A" letter-spacing="2px">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      • GRUPO RUIZ MÉXICO •
    </textPath>
  </text>

  <!-- Center badge emblem -->
  <g transform="translate(75, 80)">
    <!-- CADE text -->
    <text x="55" y="38" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="900" letter-spacing="1px" fill="#231F20">CADE</text>
    <text x="55" y="52" text-anchor="middle" font-family="'Work Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.8px" fill="#3F5D48">CALIDAD TÉCNICA</text>
    <!-- 12+ years badge -->
    <rect x="15" y="62" width="80" height="18" rx="4" fill="#EEB623"/>
    <text x="55" y="74" text-anchor="middle" font-family="'Work Sans', sans-serif" font-size="9" font-weight="800" fill="#231F20">+12 AÑOS EXPERIENCIA</text>
  </g>
</svg>
