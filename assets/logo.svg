<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <!-- ARUZ Official Logo Vector -->
  <g id="icon" transform="translate(15, 10)">
    <!-- Left Pillar / Slanted Roof (Gold #EEB623) -->
    <path d="M 0 160 L 0 75 L 42 42 L 42 160 Z" fill="#EEB623"/>
    <!-- Center Left Sloped Facet (Gold #EEB623) -->
    <path d="M 42 42 L 68 22 L 68 160 L 42 160 Z" fill="#EEB623"/>
    <!-- Center Tall Pillar Left Side (Gold Accent) -->
    <path d="M 68 22 L 95 0 L 115 16 L 115 160 L 95 160 Z" fill="#EEB623"/>
    <!-- Center Tall Pillar Main (Gold #EEB623) -->
    <path d="M 95 0 L 115 16 L 115 160 L 95 160 Z" fill="#EEB623"/>
    
    <!-- Right Tall Pillar (Carbon #231F20) -->
    <path d="M 148 50 L 190 85 L 190 160 L 148 160 Z" fill="#231F20"/>
  </g>

  <!-- Wordmark ARUZ INMOBILIARIA -->
  <g id="wordmark" transform="translate(210, 20)">
    <!-- ARUZ Title -->
    <text x="0" y="92" font-family="'Poppins', 'Montserrat', 'Arial Black', sans-serif" font-size="82" font-weight="900" letter-spacing="-1px" fill="#231F20">ARUZ</text>
    <!-- INMOBILIARIA Subtitle -->
    <text x="3" y="138" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="9.5px" fill="#231F20">INMOBILIARIA</text>
  </g>
</svg>
