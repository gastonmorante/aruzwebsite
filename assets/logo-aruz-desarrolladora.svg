      <stop offset="0%" stop-color="#F7C844"/>
      <stop offset="100%" stop-color="#EEB623"/>
    </linearGradient>
    <linearGradient id="goldFacetCenterDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A718"/>
      <stop offset="100%" stop-color="#D49610"/>
    </linearGradient>
    <linearGradient id="goldFacetTallDev" x1="0%" y1="0%" x2="100%" y2="100%">
