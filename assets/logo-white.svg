<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="100%" height="100%">
  <defs>
    <!-- Facet Gold Gradients -->
    <linearGradient id="goldFacetLeftW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C844"/>
      <stop offset="100%" stop-color="#EEB623"/>
    </linearGradient>
    <linearGradient id="goldFacetCenterW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A718"/>
      <stop offset="100%" stop-color="#D49610"/>
    </linearGradient>
    <linearGradient id="goldFacetTallW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD65E"/>
      <stop offset="60%" stop-color="#EEB623"/>
      <stop offset="100%" stop-color="#C79215"/>
    </linearGradient>
  </defs>

  <!-- ARUZ Isologo Emblem -->
  <g id="aruz-isotype" transform="translate(10, 10)">
    <!-- Left Lower Facet -->
    <polygon points="0,80 44,46 44,170 0,170" fill="url(#goldFacetLeftW)"/>
    <!-- Center Sloped Intermediate Facet -->
    <polygon points="44,46 70,26 70,170 44,170" fill="url(#goldFacetCenterW)"/>
    <!-- Tall Golden Crown Peak -->
    <polygon points="70,26 118,0 118,170 94,170 94,64 70,44" fill="url(#goldFacetTallW)"/>
    <!-- Right Monolith Column -->
    <polygon points="144,48 182,78 182,170 144,170" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark: ARUZ Vertically Centered with Isologo -->
  <g id="aruz-wordmark" transform="translate(216, 0)">
    <text x="0" y="132" font-family="'Montserrat', 'Poppins', sans-serif" font-size="108" font-weight="900" letter-spacing="-1px" fill="#FFFFFF">ARUZ</text>
  </g>
</svg>
