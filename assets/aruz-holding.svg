      <text x="0" y="52" font-family="'Poppins', sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5px" fill="#231F20">ARUZ <tspan fill="#EEB623">CORE</tspan></text>
      <text x="2" y="80" font-family="'Work Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="4px" fill="#59555A">GRUPO RUIZ MÉXICO</text>
    </g>
