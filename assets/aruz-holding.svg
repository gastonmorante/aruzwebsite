<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <!-- ARUZ CORE Holding Logo -->
  <g transform="translate(10, 10)">
    <!-- Core Polygon Quad Shield -->
    <polygon points="40,5 75,25 75,70 40,90 5,70 5,25" fill="#231F20" stroke="#EEB623" stroke-width="3"/>
    <circle cx="40" cy="48" r="16" fill="#EEB623"/>
    <text x="40" y="53" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="900" fill="#231F20">360</text>
    
    <!-- Wordmark -->
