<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="100%" height="100%">
  <!-- Luxury Seal: ARUZ CONSTRUCCIÓN -->
  <defs>
    <linearGradient id="stampRingConst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEB623"/>
      <stop offset="100%" stop-color="#C79215"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="55" cy="55" r="51" fill="none" stroke="url(#stampRingConst)" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="55" cy="55" r="46" fill="#1C1C1A" stroke="#EEB623" stroke-width="1.5"/>

  <!-- Core Content -->
  <g transform="translate(25, 20)">
    <!-- Small ARUZ Emblem -->
    <polygon points="0,25 15,14 15,50 0,50" fill="#F7C844"/>
    <polygon points="15,14 25,7 25,50 15,50" fill="#E5A718"/>
    <polygon points="25,7 40,0 40,50 32,50 32,20 25,14" fill="#FFD65E"/>
    <polygon points="48,15 60,25 60,50 48,50" fill="#FFFFFF"/>
  </g>

  <text x="55" y="82" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" letter-spacing="1.5px" fill="#EEB623">ARUZ</text>
  <text x="55" y="93" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="700" letter-spacing="1px" fill="#FFFFFF">CONSTRUCCIÓN</text>
</svg>
